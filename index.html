<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Nights</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#170b2b;color:#eaffff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center}.wrap{width:min(94vw,950px);text-align:center}h1{font-size:clamp(24px,4vw,42px);margin:16px 0 4px;letter-spacing:.08em}p{color:#9bbcc6;margin:7px 0 16px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}.score{font-size:25px;font-weight:800}.score span{color:#57edcf}.controls{display:flex;gap:8px;align-items:center}button,select{background:#35204f;color:#eaffff;border:1px solid #438c95;border-radius:9px;padding:10px 15px;font:inherit;cursor:pointer}button:hover{background:#503071}canvas{width:100%;height:auto;display:block;border:3px solid #9866df;border-radius:12px;background:#24113d;box-shadow:0 0 35px #8a45d955;touch-action:none}.hint{font-size:14px;margin:14px 0 20px;color:#9bbcc6}kbd{border:1px solid #56818b;border-radius:4px;padding:2px 6px;color:#fff}@media(max-width:600px){.bar{justify-content:center}.score{width:100%}}
</style></head><body><main class="wrap"><h1>🏓 NEON NIGHTS</h1><p>Choose your winning score and difficulty, then beat the computer!</p><div class="bar"><div class="score">YOU <span id="playerScore">0</span> : <span id="cpuScore">0</span> CPU</div><div class="controls"><label for="winPoints">Points to win</label><select id="winPoints"><option value="3">3</option><option value="5">5</option><option value="7" selected>7</option><option value="10">10</option><option value="11">11</option><option value="15">15</option><option value="21">21</option></select><label for="difficulty">Difficulty</label><select id="difficulty"><option value="easy" selected>Easy</option><option value="normal">Normal</option><option value="hard">Hard</option></select><button id="start">Start Game</button><button id="pause">Pause</button><button id="exit" hidden>Exit</button></div></div><canvas id="game" width="900" height="520" aria-label="Table tennis playing field"></canvas><div class="hint">Move your paddle with <kbd>↑</kbd> and <kbd>↓</kbd> · <kbd>Space</kbd> to pause/resume · On touchscreens, drag vertically.</div></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),ps=document.getElementById('playerScore'),cs=document.getElementById('cpuScore'),start=document.getElementById('start'),pause=document.getElementById('pause'),exit=document.getElementById('exit'),difficulty=document.getElementById('difficulty'),winPoints=document.getElementById('winPoints');const W=900,H=520,PW=14,BASE_PH=96,R=9;let PH=BASE_PH;let playerY=(H-PH)/2,cpuY=(H-PH)/2,ball={x:W/2,y:H/2,vx:0,vy:0},playerScore=0,cpuScore=0,running=false,started=false,finished=false,targetScore=7,last=0,serveDelay=0,message='PRESS START TO PLAY',keys={up:false,down:false},flash=0,flashColor='#318dff';let audioContext=null;function paddleSound(isPlayer){try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;if(!audioContext)audioContext=new AudioCtx();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});const now=audioContext.currentTime,osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(isPlayer?520:390,now);osc.frequency.exponentialRampToValueAtTime(isPlayer?300:230,now+.09);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.16,now+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+.12);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+.13)}catch(e){}}const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function settings(){return {easy:{speed:195,error:90,ball:220,paddle:150},normal:{speed:300,error:40,ball:295,paddle:115},hard:{speed:445,error:10,ball:370,paddle:96}}[difficulty.value]};function resetBall(direction){ball.x=W/2;ball.y=H/2;let angle=(Math.random()-.5)*1.05;ball.vx=direction*settings().ball*Math.cos(angle);ball.vy=settings().ball*Math.sin(angle);serveDelay=.75}function updateScore(){ps.textContent=playerScore;cs.textContent=cpuScore}function newGame(){if(audioContext&&audioContext.state==='suspended')audioContext.resume().catch(()=>{});exit.hidden=true;targetScore=Number(winPoints.value);PH=settings().paddle;winPoints.disabled=true;difficulty.disabled=true;playerScore=cpuScore=0;updateScore();playerY=cpuY=(H-PH)/2;started=running=true;finished=false;message='';resetBall(Math.random()<.5?1:-1);start.textContent='Restart';pause.textContent='Pause'}function togglePause(){if(!started||finished)return;running=!running;message=running?'':'PAUSED';pause.textContent=running?'Pause':'Resume'}function point(who){if(who==='player')playerScore++;else cpuScore++;updateScore();if(playerScore>=targetScore||cpuScore>=targetScore){finished=true;running=false;message=playerScore>=targetScore?'YOU WIN! 🏆':'COMPUTER WINS';winPoints.disabled=false;difficulty.disabled=false;start.textContent='Play Again';exit.hidden=false;return}resetBall(who==='player'?-1:1)}let aiTarget=H/2,aiTimer=0;function update(dt){flash=Math.max(0,flash-dt*3.2);if(!running)return;const movement=(keys.down?1:0)-(keys.up?1:0);playerY=clamp(playerY+movement*490*dt,0,H-PH);const cfg=settings();aiTimer-=dt;if(aiTimer<=0){aiTimer=.14;aiTarget=ball.y+(Math.random()-.5)*cfg.error*2}const center=cpuY+PH/2;cpuY=clamp(cpuY+clamp(aiTarget-center,-cfg.speed*dt,cfg.speed*dt),0,H-PH);if(serveDelay>0){serveDelay-=dt;return}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y-R<=0){ball.y=R;ball.vy=Math.abs(ball.vy)}if(ball.y+R>=H){ball.y=H-R;ball.vy=-Math.abs(ball.vy)}function hit(py,isPlayer){const face=isPlayer?37:W-37;if((isPlayer?ball.vx<0:ball.vx>0)&&Math.abs(ball.x-face)<=R+PW/2&&ball.y+R>=py&&ball.y-R<=py+PH){let offset=clamp((ball.y-(py+PH/2))/(PH/2),-1,1);let speed=Math.min(settings().ball*1.75,Math.hypot(ball.vx,ball.vy)*1.045);ball.vx=(isPlayer?1:-1)*speed*Math.cos(offset*.95);ball.vy=speed*Math.sin(offset*.95);ball.x=face+(isPlayer?R+PW/2:-R-PW/2);flash=1;paddleSound(isPlayer);flashColor=isPlayer?'#318dff':'#ff4d5a'}}hit(playerY,true);hit(cpuY,false);if(ball.x<-R)point('cpu');if(ball.x>W+R)point('player')}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#24113d';ctx.fillRect(0,0,W,H);if(flash>0){const glow=ctx.createRadialGradient(ball.x,ball.y,12,ball.x,ball.y,Math.max(W,H)*.85);const rgb=flashColor==='#318dff'?'49,141,255':'255,77,90';glow.addColorStop(0,`rgba(${rgb},${(flash*.32).toFixed(3)})`);glow.addColorStop(1,`rgba(${rgb},0)`);ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);ctx.fillStyle=`rgba(${rgb},${(flash*.075).toFixed(3)})`;ctx.fillRect(0,0,W,H)}ctx.strokeStyle='#67418d';ctx.lineWidth=3;ctx.strokeRect(13,13,W-26,H-26);ctx.setLineDash([13,13]);ctx.strokeStyle='#8654b5';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2,15);ctx.lineTo(W/2,H-15);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(W/2,H/2,65,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=19;ctx.shadowColor='#318dff';ctx.fillStyle='#318dff';ctx.fillRect(30,playerY,PW,PH);ctx.shadowColor='#ff4d5a';ctx.fillStyle='#ff4d5a';ctx.fillRect(W-44,cpuY,PW,PH);ctx.shadowColor='#f8ffff';ctx.fillStyle='#f8ffff';ctx.beginPath();ctx.arc(ball.x,ball.y,R,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(!running||serveDelay>0){if(!running){ctx.fillStyle='#160a29bf';ctx.fillRect(0,0,W,H)}ctx.textAlign='center';ctx.font='bold 40px system-ui';ctx.fillStyle='#f2ffff';if(!running)ctx.fillText(message,W/2,H/2-6);else{ctx.font='bold 20px system-ui';ctx.fillText('GET READY',W/2,H/2-75)}}}function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;update(dt);draw();requestAnimationFrame(frame)}document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowUp')keys.up=true;if(e.code==='ArrowDown')keys.down=true;if(e.code==='Space'&&!e.repeat)togglePause()});document.addEventListener('keyup',e=>{if(e.code==='ArrowUp')keys.up=false;if(e.code==='ArrowDown')keys.down=false});window.addEventListener('blur',()=>{keys.up=keys.down=false;if(running)togglePause()});function touchMove(e){const rect=canvas.getBoundingClientRect();const y=(e.clientY-rect.top)*H/rect.height;playerY=clamp(y-PH/2,0,H-PH)}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touchMove(e)});canvas.addEventListener('pointermove',e=>{if(e.buttons)touchMove(e)});exit.addEventListener('click',()=>{running=false;started=false;finished=false;playerScore=cpuScore=0;updateScore();playerY=cpuY=(H-PH)/2;ball.x=W/2;ball.y=H/2;message='PRESS START TO PLAY';start.textContent='Start Game';pause.textContent='Pause';winPoints.disabled=false;difficulty.disabled=false;exit.hidden=true;flash=0});start.addEventListener('click',newGame);pause.addEventListener('click',togglePause);if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame); else { message='BROWSER NOT SUPPORTED'; draw(); }})();
</script></body></html>
